modLoader = "javafml"
loaderVersion = "[${forgeMajor},)"
license = "All Rights Reserved"
issueTrackerURL = "https://github.com/CosmicLogic0/range-sight/issues"

[[mods]]
modId = "rangesight"
version = "${version}"
displayName = "Range Sight"
authors = "CosmicLogic"
displayURL = "https://github.com/CosmicLogic0/range-sight"
logoFile = "rangesight.png"
# Client-side only: servers don't need it, and it works on any server.
displayTest = "IGNORE_ALL_VERSION"
description = """
See invisible ranges: beacons, conduits, spawners, raids, sculk sensors and shriekers, each with its own color and toggle key.
"""

[[dependencies.rangesight]]
modId = "forge"
mandatory = true
versionRange = "[${forgeMajor},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.rangesight]]
modId = "minecraft"
mandatory = true
versionRange = "${mcRange}"
ordering = "NONE"
side = "BOTH"
