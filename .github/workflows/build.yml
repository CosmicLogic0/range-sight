# Builds Range Sight (Paper plugin + Forge/NeoForge mod) and runs every automatic test.
# Tests are copied from LogicLib and LogicLib for Paper, plus Range Sight's own self-test.
# The logs and a SUMMARY.md are pushed to branch "ci-results" so Claude can read them.
name: Build and test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  MC: "1.21.1"
  FORGE: "1.21.1-52.0.28"
  NEOFORGE: "21.1.80"

jobs:
  # ---------------------------------------------------------------- Paper plugin
  plugin-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CosmicLogic0/logiclib-paper
          path: ext/logiclib-paper
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build LogicLib for Paper (read only, used as a library)
        run: |
          mkdir -p logs plugin/libs
          cd ext/logiclib-paper && chmod +x gradlew && ./gradlew build -q
          find build/libs -name 'logiclib-paper-*.jar' ! -name '*-sources.jar' -exec cp {} ../../plugin/libs/ \;
          ls ../../plugin/libs
      - name: Build plugin + unit tests
        run: |
          set -o pipefail
          cd plugin && chmod +x gradlew
          ./gradlew build --stacktrace 2>&1 | tee ../logs/plugin-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-jars
          path: |
            plugin/build/libs/rangesight-paper-*.jar
            plugin/libs/*.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-plugin-build
          path: logs/

  # Starts a real Paper server on every target version with LogicLib + Range Sight,
  # runs "range selftest" (builds a beacon, conduit, spawner, sculk blocks and checks the ranges).
  paper-test:
    needs: plugin-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.12.2", java: 8 }
          - { mc: "1.16.5", java: 11 }
          - { mc: "1.18.2", java: 17 }
          - { mc: "1.19.2", java: 17 }
          - { mc: "1.20.1", java: 17 }
          - { mc: "1.21.1", java: 21 }
          - { mc: "1.21.11", java: 21 }
          - { mc: "26.1.2", java: 25 }
          - { mc: "26.2", java: 25 }
          - { mc: "26.3", java: 25 }
    name: paper-test (${{ matrix.mc }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v4
        with:
          name: plugin-jars
          path: jars
      - name: Download Paper ${{ matrix.mc }}
        run: |
          mkdir -p server/plugins && cd server
          bash ../ci/get-paper.sh "${{ matrix.mc }}"
          find ../jars -name "*.jar" ! -name "*-sources.jar" -exec cp {} plugins/ \;
          ls plugins
      - name: Start server, run self-test
        run: |
          chmod +x ci/server-test.sh
          AFTER_START="range selftest" ci/server-test.sh server "Range Sight self-test PASS" -- java -Xmx1500M -jar paper.jar nogui
      - name: Keep log
        if: always()
        run: mkdir -p logs && cp server/server.log "logs/paper-${{ matrix.mc }}.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-paper-${{ matrix.mc }}
          path: logs/

  # ---------------------------------------------------------------- Forge + NeoForge mod
  mod-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Forge + NeoForge jars
        run: |
          set -o pipefail
          mkdir -p logs
          cd mod && chmod +x gradlew
          ./gradlew build --continue --stacktrace 2>&1 | tee ../logs/mod-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: |
            mod/forge/build/libs/*.jar
            mod/neoforge/build/libs/*.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-mod-build
          path: logs/

  # Starts a real dedicated server with the mod (it must load and do nothing there).
  mod-server-test:
    needs: mod-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [forge, neoforge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: mod-jars
          path: jars
      - name: Install ${{ matrix.loader }} server
        run: |
          mkdir -p server/mods && cd server
          if [ "${{ matrix.loader }}" = "forge" ]; then
            curl -fsSL -o installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE}/forge-${FORGE}-installer.jar"
            java -jar installer.jar --installServer . > install.log 2>&1 || (tail -50 install.log; exit 1)
          else
            curl -fsSL -o installer.jar "https://maven.neoforged.net/releases/net/neoforged/neoforge/${NEOFORGE}/neoforge-${NEOFORGE}-installer.jar"
            java -jar installer.jar --install-server . > install.log 2>&1 || (tail -50 install.log; exit 1)
          fi
          find ../jars -name "rangesight-${{ matrix.loader }}-${MC}-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" -exec cp {} mods/ \;
          ls mods
      - name: Start server and check Range Sight
        run: |
          chmod +x ci/server-test.sh server/run.sh
          LOADER_NAME=$([ "${{ matrix.loader }}" = "forge" ] && echo Forge || echo NeoForge)
          ci/server-test.sh server "Range Sight loaded on ${LOADER_NAME}" -- bash run.sh nogui
      - name: Keep log
        if: always()
        run: mkdir -p logs && cp server/server.log "logs/mod-server-${{ matrix.loader }}.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-mod-server-${{ matrix.loader }}
          path: logs/

  # Starts the real Minecraft CLIENT (headless) with every range type on, joins a world and quits.
  mod-client-test:
    needs: mod-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [forge, neoforge]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mod-jars
          path: jars
      - name: Put Range Sight in run/mods, turn every range type on
        run: |
          mkdir -p run/mods run/config
          find jars -name "rangesight-${{ matrix.loader }}-${MC}-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" -exec cp {} run/mods/ \;
          ls run/mods
          cat > run/config/rangesight.json <<'EOF'
          {"selfTest":true,"types":{"beacon":{"enabled":true},"conduit":{"enabled":true},"spawner":{"enabled":true},
                    "raid":{"enabled":true},"sculk":{"enabled":true},"spawn_chunks":{"enabled":true}}}
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Run the Minecraft client
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: "1.21.1"
          modloader: ${{ matrix.loader }}
          mc-runtime-test: ${{ matrix.loader }}
          java: 21
      - name: Check Range Sight scanned and drew outlines
        run: |
          LOG=run/logs/latest.log
          grep -E "Range Sight (loaded|client ready|drawing|rendered)" "$LOG" || true
          grep -q "Range Sight client ready" "$LOG" || { echo "::error::Range Sight client did not start"; exit 1; }
          grep -q "Range Sight client self-test PASS" "$LOG" || { echo "::error::client self-test did not pass"; grep "self-test" "$LOG"; exit 1; }
          grep -q "Range Sight rendered its first frame" "$LOG" || { echo "::error::Range Sight never drew a frame"; exit 1; }
          echo "PASS: client scanned and drew outlines."
      - name: Keep log
        if: always()
        run: mkdir -p logs && cp run/logs/latest.log "logs/mod-client-${{ matrix.loader }}.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-mod-client-${{ matrix.loader }}
          path: logs/

  # ---------------------------------------------------------------- Mod on 26.x (mod/v26)
  mod26-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.3", "26.2", "26.1.2"]
        loader: [forge, neoforge]
    name: mod26-build (${{ matrix.loader }} ${{ matrix.mc }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Find the newest ${{ matrix.loader }} for ${{ matrix.mc }}
        id: v
        run: |
          if [ "${{ matrix.loader }}" = "forge" ]; then
            F=$(curl -s https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml | grep -o "<version>${{ matrix.mc }}-[^<]*</version>" | sed 's/<[^>]*>//g; s/^${{ matrix.mc }}-//' | tail -1)
            echo "args=-Pforge_version=$F" >> "$GITHUB_OUTPUT"
          else
            P="${{ matrix.mc }}"; case "$P" in *.*.*) ;; *) P="$P.0" ;; esac
            F=$(curl -s https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | grep -oE "<version>$P\.[0-9]+(-beta)?</version>" | sed 's/<[^>]*>//g' | sort -V | tail -1)
            echo "args=-Pneo_version=$F" >> "$GITHUB_OUTPUT"
          fi
          echo "Loader version: $F"; [ -n "$F" ] || { echo "::error::no ${{ matrix.loader }} for ${{ matrix.mc }}"; exit 1; }
          echo "loader=$F" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: mod/v26/${{ matrix.loader }}
        run: |
          set -o pipefail
          mkdir -p ../../../logs
          chmod +x gradlew
          LOG=../../../logs/mod26-build-${{ matrix.loader }}-${{ matrix.mc }}.log
          # one retry: downloads from the loader mavens sometimes drop ("Connection reset")
          ./gradlew build --no-daemon --stacktrace -Pminecraft_version=${{ matrix.mc }} ${{ steps.v.outputs.args }} > $LOG 2>&1 \
            || { echo "retrying once"; sleep 20; ./gradlew build --no-daemon --stacktrace -Pminecraft_version=${{ matrix.mc }} ${{ steps.v.outputs.args }} > $LOG 2>&1; } \
            || { tail -60 $LOG; exit 1; }
          tail -5 $LOG
      - name: Keep jar + loader version
        run: |
          mkdir -p out
          find mod/v26/${{ matrix.loader }}/build/libs -name "*.jar" ! -name "*-sources.jar" -exec cp {} out/ \;
          echo "${{ steps.v.outputs.loader }}" > out/loader-version.txt
          ls out
      - uses: actions/upload-artifact@v4
        with:
          name: mod26-${{ matrix.loader }}-${{ matrix.mc }}
          path: out/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-mod26-build-${{ matrix.loader }}-${{ matrix.mc }}
          path: logs/

  mod26-server-test:
    needs: mod26-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.3", "26.2", "26.1.2"]
        loader: [forge, neoforge]
    name: mod26-server-test (${{ matrix.loader }} ${{ matrix.mc }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/download-artifact@v4
        with:
          name: mod26-${{ matrix.loader }}-${{ matrix.mc }}
          path: jars
      - name: Install ${{ matrix.loader }} server
        run: |
          F=$(cat jars/loader-version.txt)
          mkdir -p server/mods && cd server
          if [ "${{ matrix.loader }}" = "forge" ]; then
            curl -fsSL -o installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/${{ matrix.mc }}-$F/forge-${{ matrix.mc }}-$F-installer.jar"
            java -jar installer.jar --installServer . > install.log 2>&1 || (tail -50 install.log; exit 1)
          else
            curl -fsSL -o installer.jar "https://maven.neoforged.net/releases/net/neoforged/neoforge/$F/neoforge-$F-installer.jar"
            java -jar installer.jar --install-server . > install.log 2>&1 || (tail -50 install.log; exit 1)
          fi
          cp ../jars/*.jar mods/
          ls; ls mods
      - name: Start server and check Range Sight
        run: |
          chmod +x ci/server-test.sh
          cd server
          if [ -f run.sh ]; then START="bash run.sh nogui"; else START="java -jar $(ls forge-*.jar | grep -v installer | head -1) nogui"; fi
          cd ..
          LOADER_NAME=$([ "${{ matrix.loader }}" = "forge" ] && echo Forge || echo NeoForge)
          ci/server-test.sh server "Range Sight loaded on ${LOADER_NAME}" -- $START
      - name: Keep log
        if: always()
        run: mkdir -p logs && cp server/server.log "logs/mod26-server-${{ matrix.loader }}-${{ matrix.mc }}.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-mod26-server-${{ matrix.loader }}-${{ matrix.mc }}
          path: logs/

  mod26-client-test:
    needs: mod26-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.3", "26.2", "26.1.2"]
        loader: [forge, neoforge]
    name: mod26-client-test (${{ matrix.loader }} ${{ matrix.mc }})
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mod26-${{ matrix.loader }}-${{ matrix.mc }}
          path: jars
      - name: Put Range Sight in run/mods, turn every range type on
        run: |
          mkdir -p run/mods run/config
          cp jars/*.jar run/mods/
          cat > run/config/rangesight.json <<'EOF'
          {"selfTest":true,"types":{"beacon":{"enabled":true},"conduit":{"enabled":true},"spawner":{"enabled":true},
                    "raid":{"enabled":true},"sculk":{"enabled":true},"spawn_chunks":{"enabled":true}}}
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Run the Minecraft client
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: ${{ matrix.mc }}
          modloader: ${{ matrix.loader }}
          mc-runtime-test: ${{ matrix.loader }}
          java: 25
      - name: Check Range Sight started in the client
        run: |
          LOG=run/logs/latest.log
          grep -E "Range Sight (loaded|client ready|drawing|rendered)" "$LOG" || true
          grep -q "Range Sight client ready" "$LOG" || { echo "::error::Range Sight client did not start"; exit 1; }
          grep -q "Range Sight client self-test PASS" "$LOG" || { echo "::error::client self-test did not pass"; grep "self-test" "$LOG"; exit 1; }
          grep -q "Range Sight rendered its first frame" "$LOG" || { echo "::error::Range Sight never drew a frame"; exit 1; }
          echo "PASS: client found the test beacon and drew outlines."
      - name: Keep log
        if: always()
        run: mkdir -p logs && cp run/logs/latest.log "logs/mod26-client-${{ matrix.loader }}-${{ matrix.mc }}.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-mod26-client-${{ matrix.loader }}-${{ matrix.mc }}
          path: logs/

  # ---------------------------------------------------------------- Mod on 1.16.5 - 1.21.11 (mod/legacy, Architectury Loom)
  legacy-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.21.11", loader: forge }
          - { mc: "1.21.11", loader: neoforge }
          - { mc: "1.20.1", loader: forge }
          - { mc: "1.19.2", loader: forge }
          - { mc: "1.18.2", loader: forge }
          - { mc: "1.16.5", loader: forge }
    name: legacy-build (${{ matrix.loader }} ${{ matrix.mc }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Find the newest ${{ matrix.loader }} + Architectury Loom
        id: v
        run: |
          L=$(curl -s https://maven.architectury.dev/dev/architectury/loom/dev.architectury.loom.gradle.plugin/maven-metadata.xml | grep -o "<latest>[^<]*</latest>" | sed 's/<[^>]*>//g')
          if [ "${{ matrix.loader }}" = "forge" ]; then
            F=$(curl -s https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml | grep -o "<version>${{ matrix.mc }}-[^<]*</version>" | sed 's/<[^>]*>//g; s/^${{ matrix.mc }}-//' | tail -1)
            echo "args=-Pforge_version=$F -Parch_loom_version=$L" >> "$GITHUB_OUTPUT"
          else
            P=$(echo "${{ matrix.mc }}" | sed 's/^1\.//'); case "$P" in *.*) ;; *) P="$P.0" ;; esac
            F=$(curl -s https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | grep -oE "<version>$P\.[0-9]+(-beta)?</version>" | sed 's/<[^>]*>//g' | sort -V | tail -1)
            echo "args=-Ploom.platform=neoforge -Pforge_version=$F -Parch_loom_version=$L" >> "$GITHUB_OUTPUT"
          fi
          echo "Loader $F, Loom $L"; [ -n "$F" ] || { echo "::error::no ${{ matrix.loader }} for ${{ matrix.mc }}"; exit 1; }
          echo "loader=$F" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: mod/legacy
        run: |
          mkdir -p ../../logs; chmod +x gradlew
          LOG=../../logs/legacy-build-${{ matrix.loader }}-${{ matrix.mc }}.log
          ./gradlew build --no-daemon --stacktrace -Pminecraft_version=${{ matrix.mc }} ${{ steps.v.outputs.args }} > $LOG 2>&1 \
            || { echo "retrying once"; sleep 20; ./gradlew build --no-daemon --stacktrace -Pminecraft_version=${{ matrix.mc }} ${{ steps.v.outputs.args }} > $LOG 2>&1; } \
            || { grep -E "error:|What went wrong" -A3 $LOG | head -80; exit 1; }
          tail -3 $LOG
      - name: Keep jar + loader version
        run: |
          mkdir -p out
          find mod/legacy/build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev*.jar" -exec cp {} out/ \;
          echo "${{ steps.v.outputs.loader }}" > out/loader-version.txt
          ls out
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-${{ matrix.loader }}-${{ matrix.mc }}
          path: out/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-legacy-build-${{ matrix.loader }}-${{ matrix.mc }}
          path: logs/

  legacy-server-test:
    needs: legacy-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.21.11", loader: forge, jar: forge, java: 21 }
          - { mc: "1.21.11", loader: neoforge, jar: neoforge, java: 21 }
          - { mc: "1.20.1", loader: forge, jar: forge, java: 17 }
          - { mc: "1.20.1", loader: neoforge, jar: forge, java: 17 }
          - { mc: "1.19.2", loader: forge, jar: forge, java: 17 }
          - { mc: "1.18.2", loader: forge, jar: forge, java: 17 }
          - { mc: "1.16.5", loader: forge, jar: forge, java: 8 }
    name: legacy-server-test (${{ matrix.loader }} ${{ matrix.mc }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v4
        with:
          name: legacy-${{ matrix.jar }}-${{ matrix.mc }}
          path: jars
      - name: Install ${{ matrix.loader }} ${{ matrix.mc }} server
        run: |
          mkdir -p server/mods && cd server
          if [ "${{ matrix.loader }}" = "forge" ]; then
            F=$(cat ../jars/loader-version.txt)
            curl -fsSL -o installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/${{ matrix.mc }}-$F/forge-${{ matrix.mc }}-$F-installer.jar"
            java -jar installer.jar --installServer . > install.log 2>&1 || (tail -50 install.log; exit 1)
          elif [ "${{ matrix.mc }}" = "1.20.1" ]; then
            F=$(curl -s https://maven.neoforged.net/releases/net/neoforged/forge/maven-metadata.xml | grep -oE "<version>1\.20\.1-[^<]*</version>" | sed 's/<[^>]*>//g' | sort -V | tail -1)
            echo "NeoForge 1.20.1: $F"
            curl -fsSL -o installer.jar "https://maven.neoforged.net/releases/net/neoforged/forge/$F/forge-$F-installer.jar"
            java -jar installer.jar --installServer . > install.log 2>&1 || (tail -50 install.log; exit 1)
          else
            F=$(cat ../jars/loader-version.txt)
            curl -fsSL -o installer.jar "https://maven.neoforged.net/releases/net/neoforged/neoforge/$F/neoforge-$F-installer.jar"
            java -jar installer.jar --install-server . > install.log 2>&1 || (tail -50 install.log; exit 1)
          fi
          find ../jars -name "*.jar" -exec cp {} mods/ \;
          ls; ls mods
      - name: Start server and check Range Sight
        run: |
          chmod +x ci/server-test.sh
          cd server
          if [ -f run.sh ]; then START="bash run.sh nogui"; else START="java -jar $(ls forge-*.jar | grep -v installer | head -1) nogui"; fi
          cd ..
          ci/server-test.sh server "Range Sight loaded on (Forge|NeoForge)" -- $START
      - name: Keep log
        if: always()
        run: mkdir -p logs && cp server/server.log "logs/legacy-server-${{ matrix.loader }}-${{ matrix.mc }}.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-legacy-server-${{ matrix.loader }}-${{ matrix.mc }}
          path: logs/

  legacy-client-test:
    needs: legacy-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.21.11", loader: forge, jar: forge, java: 21 }
          - { mc: "1.21.11", loader: neoforge, jar: neoforge, java: 21 }
          - { mc: "1.20.1", loader: forge, jar: forge, java: 17 }
          - { mc: "1.20.1", loader: neoforge, jar: forge, java: 17 }
          - { mc: "1.19.2", loader: forge, jar: forge, java: 17 }
          - { mc: "1.18.2", loader: forge, jar: forge, java: 17 }
          - { mc: "1.16.5", loader: forge, jar: forge, java: 8 }
    name: legacy-client-test (${{ matrix.loader }} ${{ matrix.mc }})
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: legacy-${{ matrix.jar }}-${{ matrix.mc }}
          path: jars
      - name: Put Range Sight in run/mods, turn every range type on, enable the self-test
        run: |
          mkdir -p run/mods run/config
          find jars -name "*.jar" -exec cp {} run/mods/ \;
          cat > run/config/rangesight.json <<'EOF'
          {"selfTest":true,"types":{"beacon":{"enabled":true},"conduit":{"enabled":true},"spawner":{"enabled":true},
                    "raid":{"enabled":true},"sculk":{"enabled":true},"spawn_chunks":{"enabled":true}}}
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Run the Minecraft client
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: ${{ matrix.mc }}
          modloader: ${{ matrix.loader }}
          mc-runtime-test: ${{ matrix.loader }}
          java: ${{ matrix.java }}
      - name: Check Range Sight found the test beacon and drew outlines
        run: |
          LOG=run/logs/latest.log
          grep -E "Range Sight (loaded|client|drawing|rendered)" "$LOG" || true
          grep -q "Range Sight client ready" "$LOG" || { echo "::error::Range Sight client did not start"; exit 1; }
          grep -q "Range Sight client self-test PASS" "$LOG" || { echo "::error::client self-test did not pass"; grep "self-test" "$LOG"; exit 1; }
          grep -q "Range Sight rendered its first frame" "$LOG" || { echo "::error::Range Sight never drew a frame"; exit 1; }
          echo "PASS"
      - name: Keep log
        if: always()
        run: mkdir -p logs && cp run/logs/latest.log "logs/legacy-client-${{ matrix.loader }}-${{ matrix.mc }}.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-legacy-client-${{ matrix.loader }}-${{ matrix.mc }}
          path: logs/

  # ---------------------------------------------------------------- results back to the repo
  results:
    needs: [plugin-build, paper-test, mod-build, mod-server-test, mod-client-test, mod26-build, mod26-server-test, mod26-client-test, legacy-build, legacy-server-test, legacy-client-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: log-*
          path: res
          merge-multiple: true
      - name: Push logs + summary to branch ci-results
        run: |
          cd res
          {
            echo "# CI ${GITHUB_SHA}"
            echo "- plugin-build: ${{ needs.plugin-build.result }}"
            echo "- paper-test: ${{ needs.paper-test.result }}"
            echo "- mod-build: ${{ needs.mod-build.result }}"
            echo "- mod-server-test: ${{ needs.mod-server-test.result }}"
            echo "- mod-client-test: ${{ needs.mod-client-test.result }}"
            echo "- mod26-build: ${{ needs.mod26-build.result }}"
            echo "- mod26-server-test: ${{ needs.mod26-server-test.result }}"
            echo "- mod26-client-test: ${{ needs.mod26-client-test.result }}"
            echo "- legacy-build: ${{ needs.legacy-build.result }}"
            echo "- legacy-server-test: ${{ needs.legacy-server-test.result }}"
            echo "- legacy-client-test: ${{ needs.legacy-client-test.result }}"
            echo
            echo "## Self-test lines"
            grep -h "self-test" paper-*.log 2>/dev/null || true
            echo
            echo "## Range Sight lines (mod)"
            for f in mod-*.log mod26-*.log legacy-*.log; do [ -f "$f" ] && { echo "### $f"; grep -h "Range Sight \(loaded\|client\|drawing\|rendered\)" "$f" | sed 's/^.*\]: //' | head -6; }; done
            echo
            echo "## Build errors (if any)"
            grep -h -A3 "error:\|What went wrong" legacy-build-*.log mod26-build-*.log mod-build.log plugin-build.log 2>/dev/null | head -80 || true
          } > SUMMARY.md
          echo "${GITHUB_SHA}" > COMMIT
          git init -q -b ci-results && git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm "ci ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-results
