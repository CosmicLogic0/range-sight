# Builds Range Sight (Paper plugin + Forge/NeoForge mod) and runs every automatic test.
# Tests are copied from LogicLib and LogicLib for Paper, plus Range Sight's own self-test.
# The logs and a SUMMARY.md are pushed to branch "ci-results" so Claude can read them.
name: Build and test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  MC: "1.21.1"
  FORGE: "1.21.1-52.0.28"
  NEOFORGE: "21.1.80"

jobs:
  # ---------------------------------------------------------------- Paper plugin
  plugin-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CosmicLogic0/logiclib-paper
          path: ext/logiclib-paper
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build LogicLib for Paper (read only, used as a library)
        run: |
          mkdir -p logs plugin/libs
          cd ext/logiclib-paper && chmod +x gradlew && ./gradlew build -q
          find build/libs -name 'logiclib-paper-*.jar' ! -name '*-sources.jar' -exec cp {} ../../plugin/libs/ \;
          ls ../../plugin/libs
      - name: Build plugin + unit tests
        run: |
          set -o pipefail
          cd plugin && chmod +x gradlew
          ./gradlew build --stacktrace 2>&1 | tee ../logs/plugin-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-jars
          path: |
            plugin/build/libs/rangesight-paper-*.jar
            plugin/libs/*.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-plugin-build
          path: logs/

  # Starts a real Paper server on every target version with LogicLib + Range Sight,
  # runs "range selftest" (builds a beacon, conduit, spawner, sculk blocks and checks the ranges).
  paper-test:
    needs: plugin-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.12.2", java: 8 }
          - { mc: "1.16.5", java: 11 }
          - { mc: "1.18.2", java: 17 }
          - { mc: "1.19.2", java: 17 }
          - { mc: "1.20.1", java: 17 }
          - { mc: "1.21.1", java: 21 }
          - { mc: "1.21.11", java: 21 }
          - { mc: "26.1.2", java: 25 }
          - { mc: "26.2", java: 25 }
          - { mc: "26.3", java: 25 }
    name: paper-test (${{ matrix.mc }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v4
        with:
          name: plugin-jars
          path: jars
      - name: Download Paper ${{ matrix.mc }}
        run: |
          mkdir -p server/plugins && cd server
          bash ../ci/get-paper.sh "${{ matrix.mc }}"
          find ../jars -name "*.jar" ! -name "*-sources.jar" -exec cp {} plugins/ \;
          ls plugins
      - name: Start server, run self-test
        run: |
          chmod +x ci/server-test.sh
          AFTER_START="range selftest" ci/server-test.sh server "Range Sight self-test PASS" -- java -Xmx1500M -jar paper.jar nogui
      - name: Keep log
        if: always()
        run: mkdir -p logs && cp server/server.log "logs/paper-${{ matrix.mc }}.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-paper-${{ matrix.mc }}
          path: logs/

  # ---------------------------------------------------------------- Forge + NeoForge mod
  mod-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Forge + NeoForge jars
        run: |
          set -o pipefail
          mkdir -p logs
          cd mod && chmod +x gradlew
          ./gradlew build --stacktrace 2>&1 | tee ../logs/mod-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: |
            mod/forge/build/libs/*.jar
            mod/neoforge/build/libs/*.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-mod-build
          path: logs/

  # Starts a real dedicated server with the mod (it must load and do nothing there).
  mod-server-test:
    needs: mod-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [forge, neoforge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: mod-jars
          path: jars
      - name: Install ${{ matrix.loader }} server
        run: |
          mkdir -p server/mods && cd server
          if [ "${{ matrix.loader }}" = "forge" ]; then
            curl -fsSL -o installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE}/forge-${FORGE}-installer.jar"
            java -jar installer.jar --installServer . > install.log 2>&1 || (tail -50 install.log; exit 1)
          else
            curl -fsSL -o installer.jar "https://maven.neoforged.net/releases/net/neoforged/neoforge/${NEOFORGE}/neoforge-${NEOFORGE}-installer.jar"
            java -jar installer.jar --install-server . > install.log 2>&1 || (tail -50 install.log; exit 1)
          fi
          find ../jars -name "rangesight-${{ matrix.loader }}-${MC}-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" -exec cp {} mods/ \;
          ls mods
      - name: Start server and check Range Sight
        run: |
          chmod +x ci/server-test.sh server/run.sh
          LOADER_NAME=$([ "${{ matrix.loader }}" = "forge" ] && echo Forge || echo NeoForge)
          ci/server-test.sh server "Range Sight loaded on ${LOADER_NAME}" -- bash run.sh nogui
      - name: Keep log
        if: always()
        run: mkdir -p logs && cp server/server.log "logs/mod-server-${{ matrix.loader }}.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-mod-server-${{ matrix.loader }}
          path: logs/

  # Starts the real Minecraft CLIENT (headless) with every range type on, joins a world and quits.
  mod-client-test:
    needs: mod-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [forge, neoforge]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mod-jars
          path: jars
      - name: Put Range Sight in run/mods, turn every range type on
        run: |
          mkdir -p run/mods run/config
          find jars -name "rangesight-${{ matrix.loader }}-${MC}-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" -exec cp {} run/mods/ \;
          ls run/mods
          cat > run/config/rangesight.json <<'EOF'
          {"types":{"beacon":{"enabled":true},"conduit":{"enabled":true},"spawner":{"enabled":true},
                    "raid":{"enabled":true},"sculk":{"enabled":true},"spawn_chunks":{"enabled":true}}}
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Run the Minecraft client
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: "1.21.1"
          modloader: ${{ matrix.loader }}
          mc-runtime-test: ${{ matrix.loader }}
          java: 21
      - name: Check Range Sight scanned and drew outlines
        run: |
          LOG=run/logs/latest.log
          grep -E "Range Sight (loaded|client ready|drawing|rendered)" "$LOG" || true
          grep -q "Range Sight client ready" "$LOG" || { echo "::error::Range Sight client did not start"; exit 1; }
          grep -q "Range Sight drawing" "$LOG" || { echo "::error::Range Sight found nothing to draw (spawn chunks should be there)"; exit 1; }
          grep -q "Range Sight rendered its first frame" "$LOG" || { echo "::error::Range Sight never drew a frame"; exit 1; }
          echo "PASS: client scanned and drew outlines."
      - name: Keep log
        if: always()
        run: mkdir -p logs && cp run/logs/latest.log "logs/mod-client-${{ matrix.loader }}.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-mod-client-${{ matrix.loader }}
          path: logs/

  # ---------------------------------------------------------------- results back to the repo
  results:
    needs: [plugin-build, paper-test, mod-build, mod-server-test, mod-client-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: log-*
          path: res
          merge-multiple: true
      - name: Push logs + summary to branch ci-results
        run: |
          cd res
          {
            echo "# CI ${GITHUB_SHA}"
            echo "- plugin-build: ${{ needs.plugin-build.result }}"
            echo "- paper-test: ${{ needs.paper-test.result }}"
            echo "- mod-build: ${{ needs.mod-build.result }}"
            echo "- mod-server-test: ${{ needs.mod-server-test.result }}"
            echo "- mod-client-test: ${{ needs.mod-client-test.result }}"
            echo
            echo "## Self-test lines"
            grep -h "self-test" paper-*.log 2>/dev/null || true
            echo
            echo "## Range Sight lines (mod)"
            grep -h "Range Sight" mod-*.log 2>/dev/null || true
          } > SUMMARY.md
          echo "${GITHUB_SHA}" > COMMIT
          git init -q -b ci-results && git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm "ci ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-results
