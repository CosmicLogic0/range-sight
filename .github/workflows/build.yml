# Builds Range Sight (Paper plugin + Forge/NeoForge mod) and runs every automatic test.
# Tests are copied from LogicLib and LogicLib for Paper, plus Range Sight's own self-test.
# The logs and a SUMMARY.md are pushed to branch "ci-results" so Claude can read them.
name: Build and test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  MC: "1.21.1"
  FORGE: "1.21.1-52.0.28"
  NEOFORGE: "21.1.80"

jobs:
  # ---------------------------------------------------------------- Paper plugin
  plugin-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CosmicLogic0/logiclib-paper
          path: ext/logiclib-paper
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build LogicLib for Paper (read only, used as a library)
        run: |
          mkdir -p logs plugin/libs
          cd ext/logiclib-paper && chmod +x gradlew && ./gradlew build -q
          find build/libs -name 'logiclib-paper-*.jar' ! -name '*-sources.jar' -exec cp {} ../../plugin/libs/ \;
          ls ../../plugin/libs
      - name: Build plugin + unit tests
        run: |
          set -o pipefail
          cd plugin && chmod +x gradlew
          ./gradlew build --stacktrace 2>&1 | tee ../logs/plugin-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-jars
          path: |
            plugin/build/libs/rangesight-paper-*.jar
            plugin/libs/*.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-plugin-build
          path: logs/

  # Starts a real Paper server on every target version with LogicLib + Range Sight,
  # runs "range selftest" (builds a beacon, conduit, spawner, sculk blocks and checks the ranges).
  paper-test:
    needs: plugin-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.12.2", java: 8 }
          - { mc: "1.16.5", java: 11 }
          - { mc: "1.18.2", java: 17 }
          - { mc: "1.19.2", java: 17 }
          - { mc: "1.20.1", java: 17 }
          - { mc: "1.21.1", java: 21 }
          - { mc: "1.21.11", java: 21 }
          - { mc: "26.1.2", java: 25 }
          - { mc: "26.2", java: 25 }
          - { mc: "26.3", java: 25 }
    name: paper-test (${{ matrix.mc }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v4
        with:
          name: plugin-jars
          path: jars
      - name: Download Paper ${{ matrix.mc }}
        run: |
          mkdir -p server/plugins && cd server
          bash ../ci/get-paper.sh "${{ matrix.mc }}"
          find ../jars -name "*.jar" ! -name "*-sources.jar" -exec cp {} plugins/ \;
          ls plugins
          # Edge case: a server owner broke config.yml. The plugin must keep their file, start with defaults, and work.
          mkdir -p plugins/RangeSight
          printf 'scan-chunks: [4\ncolors:\n  beacon: oops\n' > plugins/RangeSight/config.yml
      - name: Start server, run self-test
        run: |
          chmod +x ci/server-test.sh
          AFTER_START="range selftest" ci/server-test.sh server "Range Sight self-test PASS" -- java -Xmx1500M -jar paper.jar nogui
      - name: Broken config.yml was kept, defaults used, no errors from Range Sight
        run: |
          grep -q "Your file was kept as config.yml.broken" server/server.log || { echo "broken config.yml was not kept"; exit 1; }
          ls server/plugins/RangeSight/
          grep -q "scan-chunks: 4" server/plugins/RangeSight/config.yml || { echo "fresh config.yml not written"; exit 1; }
          if grep -E "(ERROR|SEVERE)\]: \[RangeSight\]" server/server.log; then echo "Range Sight logged an error"; exit 1; fi
          grep "long-distance particles" server/server.log
          if grep -q "has not responded for" server/server.log; then echo "the server froze (watchdog)"; exit 1; fi
      - name: Keep log
        if: always()
        run: mkdir -p logs && cp server/server.log "logs/paper-${{ matrix.mc }}.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-paper-${{ matrix.mc }}
          path: logs/

  # ---------------------------------------------------------------- Forge + NeoForge mod
  mod-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Forge + NeoForge jars
        run: |
          set -o pipefail
          mkdir -p logs
          cd mod && chmod +x gradlew
          ./gradlew build --continue --stacktrace 2>&1 | tee ../logs/mod-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: |
            mod/forge/build/libs/*.jar
            mod/neoforge/build/libs/*.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-mod-build
          path: logs/

  # Starts a real dedicated server with the mod (it must load and do nothing there).
  mod-server-test:
    needs: mod-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        loader: [forge, neoforge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: mod-jars
          path: jars
      - name: Install ${{ matrix.loader }} server
        run: |
          mkdir -p server/mods && cd server
          if [ "${{ matrix.loader }}" = "forge" ]; then
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE}/forge-${FORGE}-installer.jar"
            { java -jar installer.jar --installServer . > install.log 2>&1 || { sleep 20; java -jar installer.jar --installServer . > install.log 2>&1; }; } || (tail -50 install.log; exit 1)
          else
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o installer.jar "https://maven.neoforged.net/releases/net/neoforged/neoforge/${NEOFORGE}/neoforge-${NEOFORGE}-installer.jar"
            { java -jar installer.jar --install-server . > install.log 2>&1 || { sleep 20; java -jar installer.jar --install-server . > install.log 2>&1; }; } || (tail -50 install.log; exit 1)
          fi
          find ../jars -name "rangesight-${{ matrix.loader }}-${MC}-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" -exec cp {} mods/ \;
          ls mods
      - name: Start server and check Range Sight
        run: |
          chmod +x ci/server-test.sh server/run.sh
          LOADER_NAME=$([ "${{ matrix.loader }}" = "forge" ] && echo Forge || echo NeoForge)
          ci/server-test.sh server "Range Sight loaded on ${LOADER_NAME}" -- bash run.sh nogui
      - name: Keep log
        if: always()
        run: mkdir -p logs && cp server/server.log "logs/mod-server-${{ matrix.loader }}.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-mod-server-${{ matrix.loader }}
          path: logs/

  # Starts the real Minecraft CLIENT (headless) with every range type on, joins a world and quits.
  mod-client-test:
    needs: mod-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        loader: [forge, neoforge]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mod-jars
          path: jars
      - name: Put Range Sight in run/mods, turn every range type on
        run: |
          mkdir -p run/mods run/config
          find jars -name "rangesight-${{ matrix.loader }}-${MC}-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" -exec cp {} run/mods/ \;
          ls run/mods
          # Edge case: a broken config file. The mod must keep it (as .broken-<date>), start with defaults and work.
          printf '{"types":{"beacon":{"enabled":tru' > run/config/rangesight.json
          echo on > run/config/rangesight-selftest.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Run the Minecraft client
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: "1.21.1"
          modloader: ${{ matrix.loader }}
          mc-runtime-test: ${{ matrix.loader }}
          java: 21
      - name: Check Range Sight scanned and drew outlines
        run: |
          LOG=run/logs/latest.log
          grep -E "Range Sight (loaded|client ready|drawing|rendered)" "$LOG" || true
          grep -q "Range Sight client ready" "$LOG" || { echo "::error::Range Sight client did not start"; exit 1; }
          grep -q "Range Sight client self-test PASS" "$LOG" || { echo "::error::client self-test did not pass"; grep "self-test" "$LOG"; exit 1; }
          grep -q "has a mistake" "$LOG" && ls "$(dirname "$LOG")/../config/" | grep -q "rangesight.json.broken-" || { echo "::error::broken config was not kept"; exit 1; }
          grep -q "Range Sight rendered its first frame" "$LOG" || { echo "::error::Range Sight never drew a frame"; exit 1; }
          echo "PASS: client scanned and drew outlines."
      - name: Keep log
        if: always()
        run: mkdir -p logs && cp run/logs/latest.log "logs/mod-client-${{ matrix.loader }}.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-mod-client-${{ matrix.loader }}
          path: logs/

  # ---------------------------------------------------------------- Real gallery screenshots (NeoForge 1.21.1 client, Superflat)
  # Mod: the client test's new world is made Classic Flat by the CI-only PageShots helper (marker file "mod").
  page-shots:
    needs: mod-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mod-jars
          path: jars
      - name: Put Range Sight in run/mods, page-shot marker
        run: |
          mkdir -p run/mods run/config
          find jars -name "rangesight-neoforge-${MC}-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" -exec cp {} run/mods/ \;
          echo '{"lineWidth":5.0}' > run/config/rangesight.json
          echo mod > run/config/rangesight-pageshots.txt
          printf 'renderDistance:16\nsimulationDistance:12\ngraphicsMode:1\ntutorialStep:none\nskipMultiplayerWarning:true\njoinedFirstServer:true\nnarrator:0\n' > run/options.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Run the Minecraft client (real textures)
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: "1.21.1"
          modloader: neoforge
          mc-runtime-test: neoforge
          java: 21
          dummy-assets: "false"
      - name: Keep screenshots + log
        if: always()
        run: |
          mkdir -p logs
          cp run/logs/latest.log logs/page-shots.log 2>/dev/null || true
          cp run/screenshots/*.png logs/ 2>/dev/null || true
          grep "page sho" logs/page-shots.log || true
          ls -la logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-page-shots
          path: logs/

  # Plugin: a Superflat Paper 1.21.1 server with Range Sight Plugin + LogicLib Plugin; the client joins it (marker "plugin").
  plugin-shots:
    needs: [mod-build, plugin-build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mod-jars
          path: jars
      - uses: actions/download-artifact@v4
        with:
          name: plugin-jars
          path: pjars
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Start a Superflat Paper server
        run: |
          mkdir -p server/plugins && cd server
          bash ../ci/get-paper.sh 1.21.1
          find ../pjars -name "*.jar" ! -name "*-sources.jar" -exec cp {} plugins/ \;
          ls plugins
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\ngenerate-structures=false\ndifficulty=peaceful\nspawn-protection=0\ngamemode=creative\nallow-flight=true\nview-distance=16\nenforce-secure-profile=false\nspawn-monsters=false\nspawn-animals=false\n' > server.properties
          python3 - <<'PY'
          import hashlib, json, uuid
          h = bytearray(hashlib.md5(b"OfflinePlayer:Offline").digest())
          h[6] = (h[6] & 0x0f) | 0x30; h[8] = (h[8] & 0x3f) | 0x80
          u = str(uuid.UUID(bytes=bytes(h)))
          json.dump([{"uuid": u, "name": "Offline", "level": 4, "bypassesPlayerLimit": False}], open("ops.json", "w"))
          print("op", u)
          PY
          nohup java -Xmx2G -jar paper.jar nogui > server.log 2>&1 &
          for i in $(seq 1 180); do grep -q "Done (" server.log && break; sleep 1; done
          tail -5 server.log
      - name: Put Range Sight (mod off) in run/mods, plugin-shot marker
        run: |
          mkdir -p run/mods run/config
          find jars -name "rangesight-neoforge-${MC}-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" -exec cp {} run/mods/ \;
          echo '{"types":{"beacon":{"enabled":false},"conduit":{"enabled":false},"spawner":{"enabled":false},"raid":{"enabled":false},"sculk":{"enabled":false},"spawn_chunks":{"enabled":false}}}' > run/config/rangesight.json
          echo "plugin 127.0.0.1:25565" > run/config/rangesight-pageshots.txt
          printf 'renderDistance:16\nsimulationDistance:12\ngraphicsMode:1\ntutorialStep:none\nskipMultiplayerWarning:true\njoinedFirstServer:true\nnarrator:0\n' > run/options.txt
      - name: Run the Minecraft client, joining the Paper server
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: "1.21.1"
          modloader: neoforge
          mc-runtime-test: neoforge
          java: 21
          dummy-assets: "false"
          headlessmc-command: '--jvm "-Djava.awt.headless=true -DMcRuntimeGameTest=false"'
      - name: Keep screenshots + logs
        if: always()
        run: |
          mkdir -p logs
          cp run/logs/latest.log logs/plugin-shots-client.log 2>/dev/null || true
          cp server/server.log logs/plugin-shots-server.log 2>/dev/null || true
          cp run/screenshots/*.png logs/ 2>/dev/null || true
          grep "page sho" logs/plugin-shots-client.log || true
          ls -la logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-plugin-shots
          path: logs/

  # ---------------------------------------------------------------- Mod on 26.x (mod/v26)
  mod26-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.3", "26.2", "26.1.2"]
        loader: [forge, neoforge]
    name: mod26-build (${{ matrix.loader }} ${{ matrix.mc }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Find the newest ${{ matrix.loader }} for ${{ matrix.mc }}
        id: v
        run: |
          # Last tested versions, used only if the newest one can't be downloaded.
          case "${{ matrix.loader }}-${{ matrix.mc }}" in
            forge-26.1.2) LAST=64.1.6 ;; forge-26.2) LAST=65.1.6 ;; forge-26.3) LAST=66.1.9 ;;
            neoforge-26.1.2) LAST=26.1.2.129 ;; neoforge-26.2) LAST=26.2.0.95 ;; neoforge-26.3) LAST=26.3.0.115 ;; *) LAST= ;;
          esac
          if [ "${{ matrix.loader }}" = "forge" ]; then
            F=$(bash ci/loader-version.sh forge "${{ matrix.mc }}" "$LAST")
            echo "args=-Pforge_version=$F" >> "$GITHUB_OUTPUT"
          else
            P="${{ matrix.mc }}"; case "$P" in *.*.*) ;; *) P="$P.0" ;; esac
            F=$(bash ci/loader-version.sh neoforge "$P" "$LAST")
            echo "args=-Pneo_version=$F" >> "$GITHUB_OUTPUT"
          fi
          echo "Loader version: $F"; [ -n "$F" ] || { echo "::error::no ${{ matrix.loader }} for ${{ matrix.mc }}"; exit 1; }
          echo "loader=$F" >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build
        working-directory: mod/v26/${{ matrix.loader }}
        run: |
          set -o pipefail
          mkdir -p ../../../logs
          chmod +x gradlew
          LOG=../../../logs/mod26-build-${{ matrix.loader }}-${{ matrix.mc }}.log
          # one retry: downloads from the loader mavens sometimes drop ("Connection reset")
          ./gradlew build --no-daemon --stacktrace -Pminecraft_version=${{ matrix.mc }} ${{ steps.v.outputs.args }} > $LOG 2>&1 \
            || { echo "retrying once"; sleep 75; ./gradlew build --no-daemon --stacktrace -Pminecraft_version=${{ matrix.mc }} ${{ steps.v.outputs.args }} > $LOG 2>&1; } \
            || { grep -E "What went wrong|Caused by|error:|> Could not" -A3 $LOG | head -60; tail -20 $LOG; exit 1; }
          tail -5 $LOG
      - name: Keep jar + loader version
        run: |
          mkdir -p out
          find mod/v26/${{ matrix.loader }}/build/libs -name "*.jar" ! -name "*-sources.jar" -exec cp {} out/ \;
          echo "${{ steps.v.outputs.loader }}" > out/loader-version.txt
          ls out
      - uses: actions/upload-artifact@v4
        with:
          name: mod26-${{ matrix.loader }}-${{ matrix.mc }}
          path: out/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-mod26-build-${{ matrix.loader }}-${{ matrix.mc }}
          path: logs/

  mod26-server-test:
    needs: mod26-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.3", "26.2", "26.1.2"]
        loader: [forge, neoforge]
    name: mod26-server-test (${{ matrix.loader }} ${{ matrix.mc }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/download-artifact@v4
        with:
          name: mod26-${{ matrix.loader }}-${{ matrix.mc }}
          path: jars
      - name: Install ${{ matrix.loader }} server
        run: |
          F=$(cat jars/loader-version.txt)
          mkdir -p server/mods && cd server
          if [ "${{ matrix.loader }}" = "forge" ]; then
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/${{ matrix.mc }}-$F/forge-${{ matrix.mc }}-$F-installer.jar"
            { java -jar installer.jar --installServer . > install.log 2>&1 || { sleep 20; java -jar installer.jar --installServer . > install.log 2>&1; }; } || (tail -50 install.log; exit 1)
          else
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o installer.jar "https://maven.neoforged.net/releases/net/neoforged/neoforge/$F/neoforge-$F-installer.jar"
            { java -jar installer.jar --install-server . > install.log 2>&1 || { sleep 20; java -jar installer.jar --install-server . > install.log 2>&1; }; } || (tail -50 install.log; exit 1)
          fi
          cp ../jars/*.jar mods/
          ls; ls mods
      - name: Start server and check Range Sight
        run: |
          chmod +x ci/server-test.sh
          cd server
          if [ -f run.sh ]; then START="bash run.sh nogui"; else START="java -jar $(ls forge-*.jar | grep -v installer | head -1) nogui"; fi
          cd ..
          LOADER_NAME=$([ "${{ matrix.loader }}" = "forge" ] && echo Forge || echo NeoForge)
          ci/server-test.sh server "Range Sight loaded on ${LOADER_NAME}" -- $START
      - name: Keep log
        if: always()
        run: mkdir -p logs && cp server/server.log "logs/mod26-server-${{ matrix.loader }}-${{ matrix.mc }}.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-mod26-server-${{ matrix.loader }}-${{ matrix.mc }}
          path: logs/

  mod26-client-test:
    needs: mod26-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.3", "26.2", "26.1.2"]
        loader: [forge, neoforge]
    name: mod26-client-test (${{ matrix.loader }} ${{ matrix.mc }})
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mod26-${{ matrix.loader }}-${{ matrix.mc }}
          path: jars
      - name: Put Range Sight in run/mods, turn every range type on
        run: |
          mkdir -p run/mods run/config
          cp jars/*.jar run/mods/
          # Edge case: a broken config file. The mod must keep it (as .broken-<date>), start with defaults and work.
          printf '{"types":{"beacon":{"enabled":tru' > run/config/rangesight.json
          echo on > run/config/rangesight-selftest.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Run the Minecraft client
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: ${{ matrix.mc }}
          modloader: ${{ matrix.loader }}
          mc-runtime-test: ${{ matrix.loader }}
          java: 25
      - name: Check Range Sight started in the client
        run: |
          LOG=run/logs/latest.log
          grep -E "Range Sight (loaded|client ready|drawing|rendered)" "$LOG" || true
          grep -q "Range Sight client ready" "$LOG" || { echo "::error::Range Sight client did not start"; exit 1; }
          grep -q "Range Sight client self-test PASS" "$LOG" || { echo "::error::client self-test did not pass"; grep "self-test" "$LOG"; exit 1; }
          grep -q "has a mistake" "$LOG" && ls "$(dirname "$LOG")/../config/" | grep -q "rangesight.json.broken-" || { echo "::error::broken config was not kept"; exit 1; }
          grep -q "Range Sight rendered its first frame" "$LOG" || { echo "::error::Range Sight never drew a frame"; exit 1; }
          echo "PASS: client found the test beacon and drew outlines."
      - name: Keep log
        if: always()
        run: mkdir -p logs && cp run/logs/latest.log "logs/mod26-client-${{ matrix.loader }}-${{ matrix.mc }}.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-mod26-client-${{ matrix.loader }}-${{ matrix.mc }}
          path: logs/

  # ---------------------------------------------------------------- Mod on 1.16.5 - 1.21.11 (mod/legacy, Architectury Loom)
  legacy-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.21.11", loader: forge }
          - { mc: "1.21.11", loader: neoforge }
          - { mc: "1.20.1", loader: forge }
          - { mc: "1.19.2", loader: forge }
          - { mc: "1.18.2", loader: forge }
          - { mc: "1.16.5", loader: forge }
    name: legacy-build (${{ matrix.loader }} ${{ matrix.mc }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Find the newest ${{ matrix.loader }} + Architectury Loom
        id: v
        run: |
          L=$(curl -s https://maven.architectury.dev/dev/architectury/loom/dev.architectury.loom.gradle.plugin/maven-metadata.xml | grep -o "<latest>[^<]*</latest>" | sed 's/<[^>]*>//g')
          case "${{ matrix.loader }}-${{ matrix.mc }}" in
            forge-1.16.5) LAST=36.0.0 ;; forge-1.18.2) LAST=40.3.12 ;; forge-1.19.2) LAST=43.5.2 ;;
            forge-1.20.1) LAST=47.4.29 ;; forge-1.21.11) LAST=61.2.5 ;; *) LAST= ;;
          esac
          if [ "${{ matrix.loader }}" = "forge" ]; then
            F=$(bash ci/loader-version.sh forge "${{ matrix.mc }}" "$LAST")
            echo "args=-Pforge_version=$F -Parch_loom_version=$L" >> "$GITHUB_OUTPUT"
          else
            P=$(echo "${{ matrix.mc }}" | sed 's/^1\.//'); case "$P" in *.*) ;; *) P="$P.0" ;; esac
            F=$(bash ci/loader-version.sh neoforge "$P" "$LAST")
            echo "args=-Ploom.platform=neoforge -Pforge_version=$F -Parch_loom_version=$L" >> "$GITHUB_OUTPUT"
          fi
          echo "Loader $F, Loom $L"; [ -n "$F" ] || { echo "::error::no ${{ matrix.loader }} for ${{ matrix.mc }}"; exit 1; }
          echo "loader=$F" >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build
        working-directory: mod/legacy
        run: |
          mkdir -p ../../logs; chmod +x gradlew
          LOG=../../logs/legacy-build-${{ matrix.loader }}-${{ matrix.mc }}.log
          ./gradlew build --no-daemon --stacktrace -Pminecraft_version=${{ matrix.mc }} ${{ steps.v.outputs.args }} > $LOG 2>&1 \
            || { echo "retrying once"; sleep 75; ./gradlew build --no-daemon --stacktrace -Pminecraft_version=${{ matrix.mc }} ${{ steps.v.outputs.args }} > $LOG 2>&1; } \
            || { grep -E "error:|What went wrong" -A3 $LOG | head -80; exit 1; }
          tail -3 $LOG
      - name: Keep jar + loader version
        run: |
          mkdir -p out
          find mod/legacy/build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev*.jar" -exec cp {} out/ \;
          echo "${{ steps.v.outputs.loader }}" > out/loader-version.txt
          ls out
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-${{ matrix.loader }}-${{ matrix.mc }}
          path: out/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-legacy-build-${{ matrix.loader }}-${{ matrix.mc }}
          path: logs/

  legacy-server-test:
    needs: legacy-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.21.11", loader: forge, jar: forge, java: 21 }
          - { mc: "1.21.11", loader: neoforge, jar: neoforge, java: 21 }
          - { mc: "1.20.1", loader: forge, jar: forge, java: 17 }
          - { mc: "1.20.1", loader: neoforge, jar: forge, java: 17 }
          - { mc: "1.19.2", loader: forge, jar: forge, java: 17 }
          - { mc: "1.18.2", loader: forge, jar: forge, java: 17 }
          - { mc: "1.16.5", loader: forge, jar: forge, java: "8.0.312", dist: zulu }   # Forge 1.16.5 crashes on Java 8u321+
    name: legacy-server-test (${{ matrix.loader }} ${{ matrix.mc }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.dist || 'temurin' }}
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v4
        with:
          name: legacy-${{ matrix.jar }}-${{ matrix.mc }}
          path: jars
      - name: Install ${{ matrix.loader }} ${{ matrix.mc }} server
        run: |
          mkdir -p server/mods && cd server
          if [ "${{ matrix.loader }}" = "forge" ]; then
            F=$(cat ../jars/loader-version.txt)
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/${{ matrix.mc }}-$F/forge-${{ matrix.mc }}-$F-installer.jar"
            { java -jar installer.jar --installServer . > install.log 2>&1 || { sleep 20; java -jar installer.jar --installServer . > install.log 2>&1; }; } || (tail -50 install.log; exit 1)
          elif [ "${{ matrix.mc }}" = "1.20.1" ]; then
            F=$(bash ../ci/loader-version.sh neoforge-legacy 1.20.1 "")
            echo "NeoForge 1.20.1: $F"
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o installer.jar "https://maven.neoforged.net/releases/net/neoforged/forge/$F/forge-$F-installer.jar"
            { java -jar installer.jar --installServer . > install.log 2>&1 || { sleep 20; java -jar installer.jar --installServer . > install.log 2>&1; }; } || (tail -50 install.log; exit 1)
          else
            F=$(cat ../jars/loader-version.txt)
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o installer.jar "https://maven.neoforged.net/releases/net/neoforged/neoforge/$F/neoforge-$F-installer.jar"
            { java -jar installer.jar --install-server . > install.log 2>&1 || { sleep 20; java -jar installer.jar --install-server . > install.log 2>&1; }; } || (tail -50 install.log; exit 1)
          fi
          find ../jars -name "*.jar" -exec cp {} mods/ \;
          ls; ls mods
      - name: Start server and check Range Sight
        run: |
          chmod +x ci/server-test.sh
          cd server
          if [ -f run.sh ]; then START="bash run.sh nogui"; else START="java -jar $(ls forge-*.jar | grep -v installer | head -1) nogui"; fi
          cd ..
          ci/server-test.sh server "Range Sight loaded on (Forge|NeoForge)" -- $START
      - name: Keep log
        if: always()
        run: mkdir -p logs && cp server/server.log "logs/legacy-server-${{ matrix.loader }}-${{ matrix.mc }}.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-legacy-server-${{ matrix.loader }}-${{ matrix.mc }}
          path: logs/

  legacy-client-test:
    needs: legacy-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.21.11", loader: forge, jar: forge, java: 21 }
          - { mc: "1.21.11", loader: neoforge, jar: neoforge, java: 21 }
          - { mc: "1.20.1", loader: forge, jar: forge, java: 17 }
          - { mc: "1.20.1", loader: neoforge, jar: forge, java: 17, mcrt: forge }   # NeoForge 1.20.1 runs Forge mods; the test helper only has a Forge build
          - { mc: "1.19.2", loader: forge, jar: forge, java: 17 }
          - { mc: "1.18.2", loader: forge, jar: forge, java: 17 }
          - { mc: "1.16.5", loader: forge, jar: forge, java: 8 }
    name: legacy-client-test (${{ matrix.loader }} ${{ matrix.mc }})
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: legacy-${{ matrix.jar }}-${{ matrix.mc }}
          path: jars
      - name: Put Range Sight in run/mods, turn every range type on, enable the self-test
        run: |
          mkdir -p run/mods run/config
          find jars -name "*.jar" -exec cp {} run/mods/ \;
          # Edge case: a broken config file. The mod must keep it (as .broken-<date>), start with defaults and work.
          printf '{"types":{"beacon":{"enabled":tru' > run/config/rangesight.json
          echo on > run/config/rangesight-selftest.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Run the Minecraft client
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: ${{ matrix.mc }}
          modloader: ${{ matrix.loader }}
          mc-runtime-test: ${{ matrix.mcrt || matrix.loader }}
          java: ${{ matrix.java }}
      - name: Check Range Sight found the test beacon and drew outlines
        run: |
          LOG=run/logs/latest.log
          grep -E "Range Sight (loaded|client|drawing|rendered)" "$LOG" || true
          grep -q "Range Sight client ready" "$LOG" || { echo "::error::Range Sight client did not start"; exit 1; }
          grep -q "Range Sight client self-test PASS" "$LOG" || { echo "::error::client self-test did not pass"; grep "self-test" "$LOG"; exit 1; }
          grep -q "has a mistake" "$LOG" && ls "$(dirname "$LOG")/../config/" | grep -q "rangesight.json.broken-" || { echo "::error::broken config was not kept"; exit 1; }
          grep -q "Range Sight rendered its first frame" "$LOG" || { echo "::error::Range Sight never drew a frame"; exit 1; }
          echo "PASS"
      - name: Keep log
        if: always()
        run: mkdir -p logs && cp run/logs/latest.log "logs/legacy-client-${{ matrix.loader }}-${{ matrix.mc }}.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-legacy-client-${{ matrix.loader }}-${{ matrix.mc }}
          path: logs/

  # ---------------------------------------------------------------- Mod on Forge 1.12.2 (mod/v12, RetroFuturaGradle / CleanroomMC template)
  v12-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build
        working-directory: mod/v12
        run: |
          mkdir -p ../../logs; chmod +x gradlew
          LOG=../../logs/v12-build-forge-1.12.2.log
          ./gradlew build --no-daemon --stacktrace > $LOG 2>&1 \
            || { echo "retrying once"; sleep 75; ./gradlew build --no-daemon --stacktrace > $LOG 2>&1; } \
            || { grep -E "error:|What went wrong" -A3 $LOG | head -80; exit 1; }
          tail -3 $LOG
      - name: Keep jar
        run: |
          mkdir -p out
          find mod/v12/build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev*.jar" -exec cp {} out/ \;
          ls out
      - uses: actions/upload-artifact@v4
        with:
          name: v12-forge-1.12.2
          path: out/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-v12-build
          path: logs/

  v12-server-test:
    needs: v12-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - uses: actions/download-artifact@v4
        with:
          name: v12-forge-1.12.2
          path: jars
      - name: Install Forge 1.12.2 server
        run: |
          F=$(curl -s https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml | grep -o "<version>1.12.2-[^<]*</version>" | sed 's/<[^>]*>//g; s/^1.12.2-//' | tail -1)
          echo "Forge 1.12.2-$F"
          mkdir -p server/mods && cd server
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-$F/forge-1.12.2-$F-installer.jar"
          { java -jar installer.jar --installServer . > install.log 2>&1 || { sleep 20; java -jar installer.jar --installServer . > install.log 2>&1; }; } || (tail -50 install.log; exit 1)
          cp ../jars/*.jar mods/
          ls; ls mods
      - name: Start server and check Range Sight
        run: |
          chmod +x ci/server-test.sh
          JAR=$(cd server && ls forge-1.12.2-*.jar | grep -v installer | head -1)
          ci/server-test.sh server "Range Sight loaded on Forge" -- java -Xmx1500M -jar $JAR nogui
      - name: Keep log
        if: always()
        run: mkdir -p logs && cp server/server.log logs/v12-server-forge-1.12.2.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-v12-server
          path: logs/

  v12-client-test:
    needs: v12-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v12-forge-1.12.2
          path: jars
      - name: Put Range Sight in run/mods, turn every range type on, enable the self-test
        run: |
          mkdir -p run/mods run/config
          cp jars/*.jar run/mods/
          # Edge case: a broken config file. The mod must keep it (as .broken-<date>), start with defaults and work.
          printf '{"types":{"beacon":{"enabled":tru' > run/config/rangesight.json
          echo on > run/config/rangesight-selftest.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Run the Minecraft client
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: "1.12.2"
          modloader: forge
          mc-runtime-test: forge
          java: 8
      - name: Check Range Sight found the test beacon and drew outlines
        run: |
          LOG=run/logs/latest.log
          grep -E "Range Sight (loaded|client|drawing|rendered)" "$LOG" || true
          grep -q "Range Sight client ready" "$LOG" || { echo "::error::Range Sight client did not start"; exit 1; }
          grep -q "Range Sight client self-test PASS" "$LOG" || { echo "::error::client self-test did not pass"; grep "self-test" "$LOG"; exit 1; }
          grep -q "has a mistake" "$LOG" && ls "$(dirname "$LOG")/../config/" | grep -q "rangesight.json.broken-" || { echo "::error::broken config was not kept"; exit 1; }
          grep -q "Range Sight rendered its first frame" "$LOG" || { echo "::error::Range Sight never drew a frame"; exit 1; }
          echo "PASS"
      - name: Keep log
        if: always()
        run: mkdir -p logs && cp run/logs/latest.log logs/v12-client-forge-1.12.2.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-v12-client
          path: logs/

  # ---------------------------------------------------------------- results back to the repo
  # ---------------------------------------------------------------- Release jars -> branch "dist" (only when EVERY test passed)
  export:
    needs: [plugin-build, paper-test, mod-build, mod-server-test, mod-client-test, mod26-build, mod26-server-test, mod26-client-test, legacy-build, legacy-server-test, legacy-client-test, v12-build, v12-server-test, v12-client-test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Collect the tested release jars
        run: |
          mkdir -p dist
          ls -R art | head -100
          find art -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" ! -name "*-dev*.jar" ! -name "logiclib*" -exec cp {} dist/ \;
          cd dist && ls -la && sha256sum *.jar | tee SHA256SUMS && echo "${GITHUB_SHA}" > COMMIT
      - name: Push to branch dist
        run: |
          cd dist
          git init -q -b dist && git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm "dist ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" dist

  results:
    needs: [plugin-build, paper-test, mod-build, mod-server-test, mod-client-test, page-shots, plugin-shots, mod26-build, mod26-server-test, mod26-client-test, legacy-build, legacy-server-test, legacy-client-test, v12-build, v12-server-test, v12-client-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: log-*
          path: res
          merge-multiple: true
      - name: Push logs + summary to branch ci-results
        run: |
          cd res
          {
            echo "# CI ${GITHUB_SHA}"
            echo "- plugin-build: ${{ needs.plugin-build.result }}"
            echo "- paper-test: ${{ needs.paper-test.result }}"
            echo "- mod-build: ${{ needs.mod-build.result }}"
            echo "- mod-server-test: ${{ needs.mod-server-test.result }}"
            echo "- mod-client-test: ${{ needs.mod-client-test.result }}"
            echo "- page-shots: ${{ needs.page-shots.result }}"
            echo "- plugin-shots: ${{ needs.plugin-shots.result }}"
            echo "- mod26-build: ${{ needs.mod26-build.result }}"
            echo "- mod26-server-test: ${{ needs.mod26-server-test.result }}"
            echo "- mod26-client-test: ${{ needs.mod26-client-test.result }}"
            echo "- legacy-build: ${{ needs.legacy-build.result }}"
            echo "- legacy-server-test: ${{ needs.legacy-server-test.result }}"
            echo "- legacy-client-test: ${{ needs.legacy-client-test.result }}"
            echo "- v12-build: ${{ needs.v12-build.result }}"
            echo "- v12-server-test: ${{ needs.v12-server-test.result }}"
            echo "- v12-client-test: ${{ needs.v12-client-test.result }}"
            echo
            echo "## Self-test lines"
            grep -h "self-test" paper-*.log 2>/dev/null || true
            echo
            echo "## Range Sight lines (mod)"
            for f in mod-*.log mod26-*.log legacy-*.log v12-*.log; do [ -f "$f" ] && { echo "### $f"; grep -h "Range Sight \(loaded\|client\|drawing\|rendered\)" "$f" | sed 's/^.*\]: //' | head -6; }; done
            echo
            echo "## Build errors (if any)"
            grep -h -A3 "error:\|What went wrong" v12-build-*.log legacy-build-*.log mod26-build-*.log mod-build.log plugin-build.log 2>/dev/null | head -80 || true
          } > SUMMARY.md
          echo "${GITHUB_SHA}" > COMMIT
          git init -q -b ci-results && git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm "ci ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-results
