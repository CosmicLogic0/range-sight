name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: mod/v26/forge, java: 25, args: "-Pminecraft_version=26.3 -Pforge_version=66.1.9", name: forge-26.3 }
          - { dir: mod/v26/neoforge, java: 25, args: "-Pminecraft_version=26.3 -Pneo_version=26.3.0.115", name: neo-26.3 }
          - { dir: mod/v26/forge, java: 25, args: "-Pminecraft_version=26.1.2 -Pforge_version=64.1.6", name: forge-26.1.2 }
          - { dir: mod/v26/neoforge, java: 25, args: "-Pminecraft_version=26.1.2 -Pneo_version=26.1.2.129", name: neo-26.1.2 }
          - { dir: mod/legacy, java: 21, args: "-Pminecraft_version=1.21.11 -Pforge_version=61.2.5", name: forge-1.21.11 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "${{ matrix.java }}" }
      - name: Resolve
        working-directory: ${{ matrix.dir }}
        run: |
          chmod +x gradlew
          ./gradlew compileJava --no-daemon ${{ matrix.args }} > /tmp/b.log 2>&1 || true
          tail -3 /tmp/b.log
      - name: javap
        run: |
          set +e +o pipefail
          ALL=$(find ~/.gradle ${{ matrix.dir }}/build ${{ matrix.dir }}/.gradle -name "*.jar" -size +1M 2>/dev/null)
          MC=""; LOADER=""
          for j in $ALL; do
            L=$(unzip -Z1 "$j" 2>/dev/null)
            echo "$L" | grep -q "^net/minecraft/client/gui/Gui.class$" && [ -z "$MC" ] && MC="$j"
            echo "$L" | grep -qE "client/event/RenderGuiEvent|client/event/RenderGuiOverlayEvent|AddGuiOverlayLayersEvent" && LOADER="$LOADER $j"
          done
          echo "MC=$MC"; echo "LOADER=$LOADER"
          p() { echo "==== $1"; javap -cp "$MC" -p "$1" 2>&1 | grep -E "$2" | head -40; }
          p net.minecraft.client.gui.GuiGraphics "fill\(|drawString\(|pose\(|guiWidth|guiHeight|public .*class"
          p net.minecraft.client.gui.Gui "render|public .*class"
          p net.minecraft.client.particle.ParticleEngine "createParticle|add\(|public .*class"
          p net.minecraft.core.particles.DustParticleOptions "DustParticleOptions\("
          p net.minecraft.client.particle.Particle "setLifetime|setColor|scale\("
          p net.minecraft.client.resources.sounds.SimpleSoundInstance "forUI"
          p net.minecraft.sounds.SoundEvents "UI_BUTTON_CLICK"
          p net.minecraft.client.gui.Font "drawInBatch\(|width\(java.lang.String|lineHeight"
          p net.minecraft.client.Minecraft "particleEngine|getSoundManager|font;|getWindow"
          p net.minecraft.client.gui.components.EditBox "EditBox\(|setValue|getValue|setResponder|setMaxLength|setFilter"
          p org.joml.Matrix3x2fStack "pushMatrix|popMatrix|scale\(float, float\)"
          p net.minecraft.client.gui.screens.Screen "renderBackground|render\(|isPauseScreen"
          for j in $LOADER; do
            echo "#### loader jar $j"
            unzip -Z1 "$j" | grep -E "client/event/(RenderGui|CustomizeGui|AddGui|RegisterGui|RenderGameOverlay)[A-Za-z$]*\.class|GuiLayerManager|VanillaGuiLayers|ForgeLayeredDraw" | head -30
            for c in $(unzip -Z1 "$j" | grep -E "client/event/RenderGuiEvent\\\$Post\.class|client/event/AddGuiOverlayLayersEvent\.class|client/event/RenderGuiLayerEvent\\\$Post\.class" | sed 's/\.class$//; s#/#.#g'); do
              echo "== $c"; javap -cp "$j:$MC" -p "$c" | head -30
            done
          done
          true
