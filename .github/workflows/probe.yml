name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: mod/v26/forge, java: 25, args: "-Pminecraft_version=26.3 -Pforge_version=66.1.9", name: forge-26.3 }
          - { dir: mod/v26/neoforge, java: 25, args: "-Pminecraft_version=26.3 -Pneo_version=26.3.0.115", name: neo-26.3 }
          - { dir: mod/v26/forge, java: 25, args: "-Pminecraft_version=26.1.2 -Pforge_version=64.1.6", name: forge-26.1.2 }
          - { dir: mod/v26/neoforge, java: 25, args: "-Pminecraft_version=26.1.2 -Pneo_version=26.1.2.129", name: neo-26.1.2 }
          - { dir: mod/legacy, java: 21, args: "-Pminecraft_version=1.21.11 -Pforge_version=61.2.5", name: forge-1.21.11 }
          - { dir: mod/legacy, java: 21, args: "-Pminecraft_version=1.21.11 -Ploom.platform=neoforge -Pforge_version=NEO", name: neo-1.21.11 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "${{ matrix.java }}" }
      - name: Resolve
        working-directory: ${{ matrix.dir }}
        run: |
          chmod +x gradlew
          A="${{ matrix.args }}"; case "$A" in *NEO*) N=$(bash $GITHUB_WORKSPACE/ci/loader-version.sh neoforge 21.11 ""); A="${A/NEO/$N}";; esac
          L=$(curl -s https://maven.architectury.dev/dev/architectury/loom/dev.architectury.loom.gradle.plugin/maven-metadata.xml | grep -o "<latest>[^<]*</latest>" | sed 's/<[^>]*>//g')
          case "${{ matrix.dir }}" in mod/legacy) A="$A -Parch_loom_version=$L";; esac
          echo "args: $A"
          ./gradlew compileJava --no-daemon $A > /tmp/b.log 2>&1 || true
          tail -3 /tmp/b.log
      - name: javap
        run: |
          set +e +o pipefail
          ALL=$(find ~/.gradle ${{ matrix.dir }}/build ${{ matrix.dir }}/.gradle -name "*.jar" -size +1M 2>/dev/null)
          MC=""; LOADER=""
          for j in $ALL; do
            L=$(unzip -Z1 "$j" 2>/dev/null)
            echo "$L" | grep -q "^net/minecraft/client/gui/Gui.class$" && [ -z "$MC" ] && MC="$j"
            echo "$L" | grep -qE "client/event/RenderGuiEvent|client/event/RenderGuiOverlayEvent|AddGuiOverlayLayersEvent" && LOADER="$LOADER $j"
          done
          echo "MC=$MC"; echo "LOADER=$LOADER"
          p() { echo "==== $1"; javap -cp "$MC" -p "$1" 2>&1 | grep -E "$2" | head -60; }
          p net.minecraft.client.gui.GuiGraphicsExtractor "public"
          p net.minecraft.client.particle.Particle "public"
          for j in $LOADER; do
            case "$j" in *sources*|*javadoc*) continue;; esac
            echo "#### loader jar $j"
            unzip -Z1 "$j" | grep -E "client/event/(RenderGui|AddGui|RegisterGui|CustomizeGui)[A-Za-z]*(\$[A-Za-z]+)?\.class|ForgeLayeredDraw|LayeredDraw|GuiLayer\.class" | head -30
            for c in net.minecraftforge.client.gui.overlay.ForgeLayeredDraw net.minecraftforge.client.event.RenderGuiEvent\$Post net.minecraftforge.client.event.RenderGuiEvent net.neoforged.neoforge.client.event.RenderGuiEvent net.neoforged.neoforge.client.gui.GuiLayer net.minecraftforge.client.gui.overlay.ForgeLayer; do
              javap -cp "$j:$MC" -p "$c" 2>/dev/null | head -40 | sed "s/^/[$c] /"
            done
            unzip -Z1 "$j" | grep -E "LayeredDraw\$Layer|ForgeLayer\.class" | head
          done
          echo "#### MC jar LayeredDraw"; unzip -Z1 "$MC" | grep -E "LayeredDraw" | head; javap -cp "$MC" -p 'net.minecraft.client.gui.LayeredDraw$Layer' 2>&1 | head
          true
